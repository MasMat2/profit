<div class="confirmation-overlay" (click)="onCancel()">
  <div class="confirmation-container" [class]="'type-' + type" (click)="$event.stopPropagation()">
    <div class="confirmation-header">
      <div class="icon-container">
        <i class="fas" [ngClass]="{
          'fa-exclamation-triangle': type === 'warning',
          'fa-trash-alt': type === 'danger',
          'fa-info-circle': type === 'info'
        }"></i>
      </div>
      <h3>{{ title }}</h3>
    </div>

    <div class="confirmation-body">
      <p>{{ message }}</p>
    </div>

    <div class="confirmation-footer">
      <button class="btn-cancel" (click)="onCancel()">
        <i class="fas fa-times"></i>
        {{ cancelText }}
      </button>
      <button class="btn-confirm" [class]="'btn-' + type" (click)="onConfirm()">
        <i class="fas fa-check"></i>
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
