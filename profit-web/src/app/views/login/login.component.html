<div class="login-page">
  <div class="login-card">
    <div class="logo-area">
      <img src="assets/logo.png" alt="Profit" class="logo" />
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Accede a tu panel</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
    </div>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Clave</label>
        <div class="input-with-icon">
          <i class="fas fa-user"></i>
          <input type="text" [(ngModel)]="identifier" name="identifier" autocomplete="username" />
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" autocomplete="current-password" />
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <i class="fas" [ngClass]="isLoading ? 'fa-spinner fa-spin' : 'fa-sign-in-alt'"></i>
        {{ isLoading ? 'Ingresando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
