<app-shared-modal
  [modalTitle]="modalTitle"
  [viewportWidth]="60"
  [showSaveButton]="true"
  (close)="onClose()">

  <div class="socio-modal-tabs">
    <button
      type="button"
      class="tab-button"
      [class.active]="activeTab === 'general'"
      (click)="selectTab('general')">
      Datos Generales
    </button>
    <button
      type="button"
      class="tab-button"
      [class.active]="activeTab === 'suscripciones'"
      (click)="selectTab('suscripciones')">
      Suscripciones
    </button>
    <button
      type="button"
      class="tab-button"
      [class.active]="activeTab === 'ventas'"
      (click)="selectTab('ventas')">
      Ventas
    </button>
    <button
      type="button"
      class="tab-button"
      [class.active]="activeTab === 'log'"
      (click)="selectTab('log')">
      Log de Modificaciones
    </button>
  </div>

  <!-- ── Tab: Datos Generales ─────────────────────────────────────── -->
  <app-socio-general-tab
    *ngIf="activeTab === 'general'"
    [socioId]="socioId"
    (saved)="onGeneralSaved()">
  </app-socio-general-tab>

  <!-- ── Tab: Suscripciones ───────────────────────────────────────── -->
  <app-socio-suscripciones-tab
    *ngIf="activeTab === 'suscripciones'"
    [socioId]="socioId">
  </app-socio-suscripciones-tab>

  <!-- ── Tab: Ventas ──────────────────────────────────────────────── -->
  <div *ngIf="activeTab === 'ventas'" class="tab-placeholder">
    <i class="fas fa-receipt"></i>
    <p>Próximamente</p>
  </div>

  <!-- ── Tab: Log de Modificaciones ───────────────────────────────── -->
  <div *ngIf="activeTab === 'log'" class="tab-placeholder">
    <i class="fas fa-history"></i>
    <p>Próximamente</p>
  </div>

</app-shared-modal>
