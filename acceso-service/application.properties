# Configuracion de acceso-service.
#
# Precedencia: -Dclave=valor  >  variable de entorno  >  este archivo  >  valor por omision.
# El nombre de la variable de entorno es la clave en mayusculas con puntos como guion bajo:
#   acceso.api.url  ->  ACCESO_API_URL

server.port=8080

# --- TLS (produccion) ------------------------------------------------------
# La pagina Angular se sirve por HTTPS, asi que el servicio local tambien debe hablar TLS o
# Chrome bloquea la peticion (ver README, seccion PNA). Generar el PKCS12 con mkcert.
# acceso.ssl.keystore=certs/localhost.p12
# acceso.ssl.password=cambiar
# ---------------------------------------------------------------------------

# API NestJS de donde se descargan los templates de tbhuellas
acceso.api.url=http://localhost:3000
acceso.api.key=
acceso.refresh.minutes=15

# Origenes permitidos para CORS: desde donde se sirve la app Angular. Separados por coma.
acceso.allowed.origins=http://localhost:4200

# Formato de la muestra que manda el Web SDK (Fingerprint.SampleFormat.Intermediate).
# Comprobado contra la plantilla real del socio 9063: DP_VER_FEATURES y DP_PRE_REG_FEATURES
# dan MATCH, DP_REG_FEATURES falla. Ojo: que un formato "importe" no significa que identifique.
acceso.match.input.format=DP_VER_FEATURES
# Tasa de falso positivo objetivo = 1 / este valor (heredado del sample del SDK)
acceso.match.false.positive.denominator=100000
# Si el formato configurado falla, probar los demas y avisar en el log
acceso.match.format.fallback=true

# Torniquete. Dejar deshabilitado en maquinas de desarrollo sin hardware conectado.
acceso.turnstile.enabled=false
acceso.turnstile.port=COM3
acceso.turnstile.baud=9600
acceso.turnstile.command=R01
# Configurar el puerto con 'mode' antes de escribir (Windows)
acceso.turnstile.configure=true

acceso.debug=false
